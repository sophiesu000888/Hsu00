<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>損益紀錄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg: #f7f5f4;
    --panel: #ffffff;
    --panel-2: #fbebec;
    --line: #ecdfe0;
    --ink: #262524;
    --ink-dim: #8c8583;
    --accent: #e0001b;
    --accent-ink: #ffffff;
    --up: #e0001b;
    --up-ink: #ffffff;
    --down: #1f8a52;
    --mono: 'JetBrains Mono', 'Roboto Mono', 'Courier New', monospace;
    --sans: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --col-max: 11ch;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    padding:14px 10px 90px;
  }
  .wrap{max-width:100%;margin:0 auto;}

  .topbar{margin-bottom:12px;}
  .title-block .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.16em;
    color:var(--up);
    text-transform:uppercase;
    outline:none;
    border-radius:4px;
    display:block;
    width:fit-content;
    padding:2px 4px;
    margin:-2px 0 0 -4px;
  }
  .title-block h1{
    margin:3px 0 10px;
    font-size:17px;
    font-weight:700;
    letter-spacing:.01em;
    outline:none;
    border-radius:4px;
    display:block;
    width:fit-content;
    padding:2px 4px;
    margin-left:-4px;
  }

  .title-block .eyebrow[contenteditable="true"],
  .title-block h1[contenteditable="true"]{
    background:var(--panel);
    box-shadow:inset 0 0 0 1px var(--accent);
  }

  /* Month tabs */
  .month-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:8px;
    -webkit-overflow-scrolling: touch;
  }
  .month-tabs::-webkit-scrollbar{display:none;}
  .month-tab{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--panel-2);
    color:var(--ink-dim);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
    -webkit-appearance:none;
  }
  .month-tab.active{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
    font-weight:700;
  }
  .month-tab.add-tab{
    color:var(--accent);
    border-style:dashed;
  }

  .controls{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling: touch;
  }
  .controls::-webkit-scrollbar{display:none;}
  button{
    font-family:var(--sans);
    font-size:12.5px;
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
    -webkit-appearance:none;
  }
  button:active{border-color:var(--accent);}
  button.primary{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
    font-weight:700;
  }
  button.danger{
    background:var(--up);
    color:var(--up-ink);
    border-color:var(--up);
    font-weight:700;
  }

  .hint{
    font-size:10.5px;
    color:var(--ink-dim);
    margin:0 0 10px;
    font-family:var(--mono);
    line-height:1.5;
  }
  .hint b{color:var(--ink);}

  .table-shell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:auto;
    max-height: 68vh;
    -webkit-overflow-scrolling: touch;
    width:100%;
    position:relative;
  }
  table{
    table-layout:auto;
    border-collapse:separate;
    border-spacing:0;
    width:max-content;
    min-width:100%;
  }

  thead th{
    background:var(--panel-2);
    border-bottom:2px solid var(--accent);
    border-right:1px solid var(--line);
    padding:0;
    position:sticky;
    top:0;
    z-index:3;
  }
  thead th:last-of-type{border-right:none;}

  th.col-num-head, td.row-num{
    position:sticky;
    left:0;
    z-index:4;
    width:28px;
    min-width:28px;
    max-width:28px;
  }
  th.col-num-head{ z-index:5; background:var(--panel-2); }
  .add-row-th-btn{
    width:100%;
    height:100%;
    min-height:38px;
    background:none;
    border:none;
    color:var(--accent);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    padding:8px 0;
  }
  .add-row-th-btn:active{ background:rgba(224,0,27,.12); }

  .th-label{
    width:100%;
    max-width:var(--col-max);
    padding:9px 6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.01em;
    white-space:normal;
    word-break:break-word;
    line-height:1.3;
    text-align:center;
    display:block;
  }

  tbody td{
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:0;
    font-size:12.5px;
    font-family:var(--mono);
  }
  td.row-num{
    background:var(--panel-2);
    color:var(--ink-dim);
    font-size:10px;
    text-align:center;
    vertical-align:middle;
    border-right:1px solid var(--line);
    cursor:pointer;
  }
  td.row-num:active{background:rgba(224,0,27,.14); color:var(--up);}
  tbody tr:nth-child(even) td:not(.row-num){background:rgba(0,0,0,.02);}

  tbody td{
    text-align:center;
    vertical-align:middle;
  }
  tbody td.align-right{
    text-align:right;
  }

  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    width:auto;
    max-width:var(--col-max);
    min-height:38px;
    padding:7px 8px;
    outline:none;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:break-word;
    line-height:1.35;
    margin:0 auto;
  }
  td.align-right .cell{
    justify-content:flex-end;
    margin:0 0 0 auto;
  }
  .cell:focus{
    background:var(--bg);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  .cell:empty::before{
    content: attr(data-ph);
    color:#c2b8b6;
  }

  .cell-text-input{
    display:block;
    width:100%;
    max-width:var(--col-max);
    min-height:38px;
    padding:7px 8px;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:var(--sans);
    font-size:12.5px;
    line-height:1.35;
    text-align:center;
  }
  .cell-text-input::placeholder{
    color:#c2b8b6;
  }
  .cell-text-input:focus{
    background:var(--bg);
    box-shadow:inset 0 0 0 1px var(--accent);
  }

  .date-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:38px;
    padding:7px 6px;
    cursor:pointer;
    position:relative;
  }
  .date-cell .date-display{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink);
    white-space:nowrap;
  }
  .date-cell .date-display.placeholder{
    color:#c2b8b6;
  }
  input.cell-date{
    color-scheme: light;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:var(--mono);
    font-size:12px;
    width:100%;
    height:100%;
    padding:0;
    outline:none;
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
  }

  /* 買賣別 select */
  select.cell-select{
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:var(--sans);
    font-size:12.5px;
    width:100%;
    max-width:var(--col-max);
    min-height:38px;
    padding:7px 6px;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    text-align:center;
    text-align-last:center;
  }
  select.cell-select:focus{
    background:var(--bg);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  select.cell-select option{ background:var(--panel); color:var(--ink); }
  select.cell-select.buy{ color:var(--up); font-weight:700; }
  select.cell-select.sell{ color:var(--down); font-weight:700; }

  /* 損益金額 numeric cell coloring */
  .cell.num-pos{ color:var(--up); font-weight:700; }
  .cell.num-neg{ color:var(--down); font-weight:700; }

  /* Totals row */
  tr.totals-row td{
    background:var(--panel-2) !important;
    border-top:2px solid var(--accent);
    font-weight:700;
    position:sticky;
    bottom:0;
    z-index:2;
  }
  tr.totals-row td.row-num{ z-index:3; }
  .totals-label{
    padding:9px 8px;
    font-size:11.5px;
    color:var(--ink-dim);
    text-align:right;
    display:block;
  }
  .totals-val{
    padding:9px 8px;
    font-size:12.5px;
    display:block;
  }
  .totals-val.pos{ color:var(--up); }
  .totals-val.neg{ color:var(--down); }

  .bottombar{
    position: sticky;
    bottom: 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:10px;
    font-size:11px;
  }
  .status{font-family:var(--mono);color:var(--ink-dim);}
  .status.saved{color:var(--down);}
  .link-btn{
    background:none;border:none;color:var(--ink-dim);
    text-decoration:underline;font-size:11px;padding:6px 0;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(40,36,28,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    width:100%;
    max-width:360px;
    padding:20px;
  }
  .modal-step{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .modal-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 10px;
  }
  .modal-msg{
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.6;
    margin:0 0 16px;
  }
  .modal-msg b{color:var(--ink);}
  .modal-input, select.modal-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ink);
    font-size:14px;
    padding:11px 12px;
    margin-bottom:14px;
    font-family:var(--sans);
  }
  .modal-input:focus{outline:none;border-color:var(--accent);}
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .modal-actions button{flex:1;}

  .settings-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:8px;
  }
  .settings-list button{
    width:100%;
    text-align:left;
    padding:12px 14px;
    font-size:13.5px;
  }
  .settings-list button.del-action{color:var(--up);border-color:var(--up);}

  @media (min-width: 720px){
    body{padding:28px 24px 60px;}
    .wrap{max-width:1180px;}
    .title-block h1{font-size:22px;}
    .table-shell{max-height:none;}
  }

  @media print{
    body{background:#fff;color:#111;padding:0;}
    .topbar .controls, .month-tabs, .bottombar, .hint{display:none !important;}
    .wrap{max-width:none;}
    .table-shell{border:none;background:#fff;max-height:none;overflow:visible;}
    table{min-width:0;width:100%;table-layout:fixed;}
    thead th{background:#fff !important;border-bottom:1.5px solid #111;border-right:1px solid #ccc;position:static;}
    tbody td{border-bottom:1px solid #ccc;border-right:1px solid #ccc;color:#111;}
    td.row-num, th.col-num-head{position:static;background:#f0f0f0 !important;color:#555;width:4%;}
    tbody tr:nth-child(even) td:not(.row-num){background:#f7f7f7 !important;}
    .cell, .date-cell, select.cell-select, .cell-text-input{min-height:14px;padding:2px 3px;font-size:8.5px;color:#111;}
    .th-label{padding:4px 3px;font-size:9.5px;}
    .date-cell .date-display{color:#111;font-size:8.5px;}
    tr.totals-row td{position:static;}
    .totals-label, .totals-val{padding:3px;font-size:8.5px;}
    thead{display:table-header-group;}
    tr{break-inside:avoid;}
    th:nth-child(2), td:nth-child(2){width:13%;}
    th:nth-child(3), td:nth-child(3){width:9%;}
    th:nth-child(4), td:nth-child(4){width:16%;}
    th:nth-child(5), td:nth-child(5){width:11%;}
    th:nth-child(6), td:nth-child(6){width:12%;}
    th:nth-child(7), td:nth-child(7){width:10%;}
    th:nth-child(8), td:nth-child(8){width:25%;}
    @page{size:A4 portrait;margin:8mm;}
  }

  /* ---------- Login screen ---------- */
  #loginScreen{
    position:fixed; inset:0; background:var(--bg); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #loginScreen .login-card{
    width:100%; max-width:320px; background:var(--panel);
    border-radius:14px; box-shadow:0 8px 40px rgba(224,0,27,.12);
    overflow:hidden; border:1px solid var(--line);
  }
  #loginScreen .login-head{
    background:var(--accent); padding:26px 24px 20px; text-align:center;
  }
  #loginScreen .login-head .emoji{font-size:34px;margin-bottom:6px;}
  #loginScreen .login-head .t1{font-size:19px;font-weight:700;color:#fff;letter-spacing:-0.01em;}
  #loginScreen .login-head .t2{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:4px;font-family:var(--mono);}
  .login-tabs{display:flex;border-bottom:1px solid var(--line);}
  .login-tab{
    flex:1;padding:12px;border:none;background:var(--panel);color:var(--ink-dim);
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);
    border-bottom:2px solid transparent;
  }
  .login-tab.active{background:var(--panel-2);color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);}
  .login-panel{padding:20px 22px 18px;display:flex;flex-direction:column;gap:10px;}
  .login-panel input{
    width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);
    font-size:14.5px;font-family:var(--sans);outline:none;background:var(--bg);color:var(--ink);
  }
  .login-panel input[type="password"]{font-family:var(--mono);}
  .login-panel input:focus{border-color:var(--accent);}
  .login-panel button.primary{width:100%;padding:12px;border-radius:8px;font-size:14.5px;margin-top:2px;}
  .login-err{font-size:12.5px;color:var(--accent);min-height:16px;text-align:center;font-family:var(--sans);}
  .login-forgot{background:none;border:none;color:var(--ink-dim);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:var(--sans);}

  /* ---------- App header user row ---------- */
  .user-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;font-size:12px;color:var(--ink-dim);font-family:var(--mono);
  }
  .user-row .user-name{color:var(--ink);font-weight:700;}
  .user-row button{padding:6px 10px;font-size:11.5px;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-head">
      <div class="emoji">📈</div>
      <div class="t1">損益紀錄</div>
      <div class="t2">GO RICH!!!</div>
    </div>
    <div class="login-tabs">
      <button id="tabLogin" class="login-tab active">登入</button>
      <button id="tabRegister" class="login-tab">註冊帳號</button>
    </div>
    <div id="panelLogin" class="login-panel">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="loginPwd" type="password" placeholder="密碼" autocomplete="current-password">
      <button id="btnLogin" class="primary">進入</button>
      <div id="loginError" class="login-err"></div>
      <button id="btnForgotPwd" class="login-forgot">忘記密碼？</button>
    </div>
    <div id="panelRegister" class="login-panel" style="display:none">
      <input id="regName" type="text" placeholder="你的名稱（例：小明）">
      <input id="regEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="regPwd" type="password" placeholder="設定密碼（至少6位）" autocomplete="new-password">
      <button id="btnRegister" class="primary">建立帳號</button>
      <div id="registerError" class="login-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appRoot" style="display:none">
<div class="wrap">
  <div class="user-row">
    <span>目前登入：<span class="user-name" id="headerUserName">—</span></span>
    <button id="btnLogout">登出</button>
  </div>

  <div class="topbar">
    <div class="title-block">
      <div class="eyebrow" id="eyebrowText" contenteditable="false" spellcheck="false"></div>
      <h1 id="headingText" contenteditable="false" spellcheck="false"></h1>
    </div>

    <div class="month-tabs" id="monthTabs"></div>

    <div class="controls">
      <button class="danger" id="delMonthBtn">刪除本月份</button>
      <button class="ghost" id="exportExcelBtn">轉存 Excel</button>
      <button class="ghost" id="backupRestoreBtn">備份／恢復</button>
      <button class="primary" id="printBtn">列印 / PDF</button>
    </div>
  </div>
  <input type="file" id="restoreFileInput" accept="application/json" style="display:none;">
  <datalist id="reasonList"></datalist>


  <div class="table-shell">
    <table id="mainTable">
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="bodyRows"></tbody>
      <tfoot id="footRows"></tfoot>
    </table>
  </div>

  <div class="bottombar">
    <span class="status" id="statusText">已載入</span>
    <button class="link-btn" id="resetBtn">清除本月份所有資料</button>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-step" id="modalStep"></div>
    <h3 class="modal-title" id="modalTitle"></h3>
    <p class="modal-msg" id="modalMsg"></p>
    <input type="text" class="modal-input" id="modalInput" style="display:none;">
    <select class="modal-input" id="modalMonthSelect" style="display:none;"></select>
    <div class="settings-list" id="settingsList" style="display:none;"></div>
    <div class="modal-actions" id="modalActions">
      <button id="modalCancel">取消</button>
      <button class="primary" id="modalNext">下一步</button>
    </div>
  </div>
</div>
</div><!-- /appRoot -->

<script type="module">
// ── FIREBASE（與工作紀錄 App 共用登入帳號）────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCy_YhnZ4hJnhUGp8FjIm0Imh1FEoHxWME",
  authDomain: "hsu00-28f83.firebaseapp.com",
  projectId: "hsu00-28f83",
  storageBucket: "hsu00-28f83.firebasestorage.app",
  messagingSenderId: "273595341096",
  appId: "1:273595341096:web:14e55d1e3a9a1e7d5b981d"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

// 每位使用者的損益紀錄存在 users/{uid}/pnl/state
function pnlDocRef(uid){ return doc(db, 'users', uid, 'pnl', 'state'); }
let currentUid = null;

// ── TAB 切換 ──────────────────────────────────────────────
function switchLoginTab(tab){
  const isLogin = tab === 'login';
  document.getElementById('panelLogin').style.display = isLogin ? 'flex' : 'none';
  document.getElementById('panelRegister').style.display = isLogin ? 'none' : 'flex';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginError').textContent = '';
  document.getElementById('registerError').textContent = '';
}
document.getElementById('tabLogin').addEventListener('click', ()=>switchLoginTab('login'));
document.getElementById('tabRegister').addEventListener('click', ()=>switchLoginTab('register'));

// ── AUTH UI ───────────────────────────────────────────────
function showLoginScreen(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appRoot').style.display='none';
  setTimeout(()=>document.getElementById('loginEmail').focus(),100);
}
function hideLoginScreen(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appRoot').style.display='block';
}

async function tryLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');
  if(!email||!pwd){ errEl.textContent='請填寫 Email 和密碼'; return; }
  btn.textContent='驗證中…'; btn.disabled=true; errEl.textContent='';
  try{
    await signInWithEmailAndPassword(auth, email, pwd);
  }catch(e){
    const msg = e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ? '❌ Email 或密碼錯誤' : '❌ 登入失敗，請稍後再試';
    errEl.textContent = msg;
    document.getElementById('loginPwd').value='';
    document.getElementById('loginPwd').focus();
  }finally{
    btn.textContent='進入'; btn.disabled=false;
  }
}

async function tryRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const errEl = document.getElementById('registerError');
  const btn = document.getElementById('btnRegister');
  if(!name){ errEl.textContent='請輸入你的名稱'; return; }
  if(!email){ errEl.textContent='請輸入 Email'; return; }
  if(!pwd||pwd.length<6){ errEl.textContent='密碼至少需要 6 位'; return; }
  btn.textContent='建立中…'; btn.disabled=true; errEl.textContent='';
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
    await updateProfile(cred.user, { displayName: name });
  }catch(e){
    const msg = e.code==='auth/email-already-in-use'
      ? '❌ 此 Email 已被使用' : e.code==='auth/invalid-email'
      ? '❌ Email 格式不正確' : '❌ 註冊失敗，請稍後再試';
    errEl.textContent = msg;
  }finally{
    btn.textContent='建立帳號'; btn.disabled=false;
  }
}

document.getElementById('btnForgotPwd').addEventListener('click', async()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  if(!email){ errEl.style.color='var(--accent)'; errEl.textContent='請先填入 Email，再點忘記密碼'; return; }

  }
});

document.getElementById('btnLogout').addEventListener('click', async()=>{

});

(function(){
  const ROWS_PER_PAGE = 22;

  // Fixed columns for every month page
  const COLUMNS = [
    {id:'date',   label:'日期',     type:'date'},
    {id:'side',   label:'買賣別',   type:'select'},
    {id:'point',  label:'進場點位', type:'text'},
    {id:'pnl',    label:'損益',     type:'number'},
    {id:'amount', label:'損益金額', type:'number'},
    {id:'fee',    label:'手續費',   type:'number'},
    {id:'reason', label:'進場原因', type:'reason'},
  ];

  function monthKeyNow(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabel(key){
    const [y,m] = key.split('-');
    return y + '年' + parseInt(m,10) + '月';
  }
  const WEEKDAY_ZH = ['日','一','二','三','四','五','六'];
  function formatDateDisplay(isoStr){
    if(!isoStr) return '';
    const parts = isoStr.split('-');
    if(parts.length !== 3) return isoStr;
    const y = parseInt(parts[0],10), mo = parseInt(parts[1],10), d = parseInt(parts[2],10);
    const dt = new Date(y, mo-1, d);
    if(isNaN(dt.getTime())) return isoStr;
    return mo + '/' + d + '（' + WEEKDAY_ZH[dt.getDay()] + '）';
  }
  function makeRow(){
    return { id: 'r'+Math.random().toString(36).slice(2,10), cells: {date:'', side:'', point:'', pnl:'', amount:'', fee:'', reason:''} };
  }
  function makeMonth(key){
    const rows = [];
    for(let i=0;i<ROWS_PER_PAGE;i++) rows.push(makeRow());
    return { key, rows };
  }

  const DEFAULT_TITLES = { eyebrow: 'GO RICH!!!', heading: '損益紀錄' };

  let state = {
    months: {},      // key -> { key, rows: [...] }
    order: [],        // array of keys, chronological
    activeKey: null,
    titles: { eyebrow: DEFAULT_TITLES.eyebrow, heading: DEFAULT_TITLES.heading }
  };

  function ensureMonth(key){
    if(!state.months[key]){
      state.months[key] = makeMonth(key);
      if(!state.order.includes(key)){
        state.order.push(key);
        state.order.sort();
      }
    }
  }

  function ensureRowShape(row){
    COLUMNS.forEach(c => { if(!(c.id in row.cells)) row.cells[c.id] = ''; });
  }

  const statusEl = document.getElementById('statusText');
  let saveTimer = null;
  let pnlLoadSuccess = false; // 該使用者的雲端資料尚未成功載入前，禁止寫入，避免用空資料覆蓋雲端舊資料
  function markUnsaved(){
    statusEl.textContent = '尚未儲存…';
    statusEl.classList.remove('saved');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
  }
  async function save(){
    if(!currentUid) return;
    if(!pnlLoadSuccess){
      statusEl.textContent = '⚠️ 尚未完成雲端讀取，暫不儲存';
      statusEl.classList.remove('saved');
      console.warn('save() blocked: pnlLoadSuccess=false');
      return;
    }
    try{
      await setDoc(pnlDocRef(currentUid), { state: JSON.stringify(state), updatedAt: Date.now() });
      statusEl.textContent = '已儲存 · ' + new Date().toLocaleTimeString('zh-TW',{hour12:false});
      statusEl.classList.add('saved');
    }catch(e){
      console.error('save error', e);
      try{
        await new Promise(r => setTimeout(r, 400));
        await setDoc(pnlDocRef(currentUid), { state: JSON.stringify(state), updatedAt: Date.now() });
        statusEl.textContent = '已儲存 · ' + new Date().toLocaleTimeString('zh-TW',{hour12:false});
        statusEl.classList.add('saved');
      }catch(e2){
        statusEl.textContent = '⚠️ 儲存失敗，請確認網路連線';
        statusEl.classList.remove('saved');
        console.error('save retry error', e2);
      }
    }
  }
  async function load(){
    pnlLoadSuccess = false;
    statusEl.textContent = '雲端讀取中…';
    statusEl.classList.remove('saved');
    // 重置為預設空白狀態（避免帳號切換時殘留上一位使用者的資料）
    state = { months: {}, order: [], activeKey: null, titles: { eyebrow: DEFAULT_TITLES.eyebrow, heading: DEFAULT_TITLES.heading } };
    try{
      const snap = await getDoc(pnlDocRef(currentUid));
      if(snap.exists() && snap.data().state){
        const parsed = JSON.parse(snap.data().state);
        if(parsed && parsed.months && parsed.order){
          state = parsed;
        }
      }
      pnlLoadSuccess = true;
    }catch(e){
      console.error('load error', e);
      statusEl.textContent = '⚠️ 雲端讀取失敗，請確認網路後重新整理';
      statusEl.classList.remove('saved');
    }

    if(state.order.length === 0){
      const key = monthKeyNow();
      ensureMonth(key);
      state.activeKey = key;
    }
    if(!state.activeKey || !state.months[state.activeKey]){
      state.activeKey = state.order[0];
    }
    if(!state.titles || typeof state.titles !== 'object'){
      state.titles = { eyebrow: DEFAULT_TITLES.eyebrow, heading: DEFAULT_TITLES.heading };
    }
    if(!state.titles.eyebrow) state.titles.eyebrow = DEFAULT_TITLES.eyebrow;
    if(!state.titles.heading) state.titles.heading = DEFAULT_TITLES.heading;
    if(state.titles.eyebrow === 'GO RICH') state.titles.eyebrow = DEFAULT_TITLES.eyebrow;

    state.order.forEach(k => {
      state.months[k].rows.forEach(ensureRowShape);
    });

    renderTitles();
    render();
    if(pnlLoadSuccess){
      statusEl.textContent = '已載入';
      statusEl.classList.add('saved');
    }
  }

  function currentMonth(){
    return state.months[state.activeKey];
  }

  // ---------- Modal engine ----------
  const overlay = document.getElementById('modalOverlay');
  const stepEl = document.getElementById('modalStep');
  const titleEl = document.getElementById('modalTitle');
  const msgEl = document.getElementById('modalMsg');
  const inputEl = document.getElementById('modalInput');
  const monthSelectEl = document.getElementById('modalMonthSelect');
  const settingsList = document.getElementById('settingsList');
  const modalActions = document.getElementById('modalActions');
  const cancelBtn = document.getElementById('modalCancel');
  const nextBtn = document.getElementById('modalNext');

  let flow = null;

  function closeModal(){
    overlay.classList.remove('open');
    flow = null;
  }
  function openModal(){ overlay.classList.add('open'); }

  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

  nextBtn.addEventListener('click', () => {
    if(!flow) return;
    if(flow.step < flow.totalSteps){
      if(flow.beforeNext && flow.beforeNext() === false) return;
      flow.step++;
      renderFlow();
    } else {
      flow.commit();
      closeModal();
    }
  });

  function resetModalChrome(){
    stepEl.style.display = 'block';
    modalActions.style.display = 'flex';
    inputEl.style.display = 'none';
    monthSelectEl.style.display = 'none';
    settingsList.style.display = 'none';
    settingsList.innerHTML = '';
    nextBtn.style.display = 'block';
    nextBtn.className = 'primary';
    nextBtn.textContent = '下一步';
  }

  function renderFlow(){
    resetModalChrome();
    stepEl.textContent = '步驟 ' + flow.step + ' / ' + flow.totalSteps;
    flow.render();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ADD MONTH — pick month, 1 confirmation
  function openAddMonth(){
    // build list of candidate months: next 12 not already present, plus custom option via input fallback
    const existing = new Set(state.order);
    const candidates = [];
    const base = new Date();
    for(let i=-6;i<=12;i++){
      const d = new Date(base.getFullYear(), base.getMonth()+i, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      if(!existing.has(key)) candidates.push(key);
    }
    flow = {
      kind:'addMonth', step:1, totalSteps:2,
      data:{ key: candidates[0] || monthKeyNow() },
      beforeNext(){
        flow.data.key = monthSelectEl.value;
        return true;
      },
      render(){
        if(flow.step === 1){
          titleEl.textContent = '新增月份頁面';
          msgEl.textContent = '選擇要新增的月份：';
          monthSelectEl.style.display = 'block';
          monthSelectEl.innerHTML = '';
          candidates.forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = monthLabel(key);
            monthSelectEl.appendChild(opt);
          });
          monthSelectEl.value = flow.data.key;
        } else {
          titleEl.textContent = '確認新增';
          msgEl.innerHTML = '確定要新增「<b>' + escapeHtml(monthLabel(flow.data.key)) + '</b>」頁面嗎？';
          nextBtn.textContent = '確認新增';
        }
      },
      commit(){
        ensureMonth(flow.data.key);
        state.activeKey = flow.data.key;
        render();
        markUnsaved();
      }
    };
    renderFlow();
    openModal();
  }

  // DELETE MONTH — 2 confirmations
  function openDeleteMonth(){
    if(state.order.length <= 1){
      alert('至少需保留一個月份頁面，無法刪除。');
      return;
    }
    const key = state.activeKey;
    flow = {
      kind:'deleteMonth', step:1, totalSteps:2,
      data:{ key },
      render(){
        if(flow.step === 1){
          titleEl.textContent = '刪除月份頁面';
          msgEl.innerHTML = '確定要刪除「<b>' + escapeHtml(monthLabel(key)) + '</b>」整頁資料嗎？';
        } else {
          titleEl.textContent = '最後確認';
          msgEl.innerHTML = '此動作<b>無法復原</b>，「<b>' + escapeHtml(monthLabel(key)) + '</b>」所有紀錄都會遺失。真的要刪除嗎？';
          nextBtn.textContent = '確認刪除';
          nextBtn.className = 'danger';
        }
      },
      commit(){
        delete state.months[key];
        state.order = state.order.filter(k => k !== key);
        state.activeKey = state.order[0];
        render();
        markUnsaved();
      }
    };
    renderFlow();
    openModal();
  }

  // DELETE ROW — 3 confirmations, then top back up to ROWS_PER_PAGE
  function openDeleteRow(rIdx){
    const month = currentMonth();
    flow = {
      kind:'deleteRow', step:1, totalSteps:3,
      data:{ rIdx, num: rIdx + 1 },
      render(){
        if(flow.step === 1){
          titleEl.textContent = '刪除列';
          msgEl.innerHTML = '確定要刪除第 <b>' + flow.data.num + '</b> 列嗎？';
        } else if(flow.step === 2){
          titleEl.textContent = '再次確認';
          msgEl.innerHTML = '此列中<b>所有已填寫的資料</b>都會一併遺失，確定要繼續刪除第 <b>' + flow.data.num + '</b> 列嗎？';
        } else {
          titleEl.textContent = '最後確認';
          msgEl.innerHTML = '此動作<b>無法復原</b>。真的要刪除第 <b>' + flow.data.num + '</b> 列嗎？';
          nextBtn.textContent = '確認刪除';
          nextBtn.className = 'danger';
        }
      },
      commit(){
        month.rows.splice(flow.data.rIdx, 1);
        while(month.rows.length < ROWS_PER_PAGE){
          month.rows.push(makeRow());
        }
        render();
        markUnsaved();
      }
    };
    renderFlow();
    openModal();
  }

  // ---------- Render ----------
  function render(){
    renderMonthTabs();
    renderHeader();
    renderBody();
    updateReasonDatalist();
  }

  function updateReasonDatalist(){
    const dl = document.getElementById('reasonList');
    if(!dl) return;
    const seen = new Set();
    state.order.forEach(k => {
      const m = state.months[k];
      if(!m) return;
      m.rows.forEach(r => {
        const v = (r.cells.reason || '').trim();
        if(v) seen.add(v);
      });
    });
    dl.innerHTML = '';
    Array.from(seen).sort((a,b) => a.localeCompare(b, 'zh-Hant')).forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  // ---------- Editable titles ----------
  function renderTitles(){
    const eyebrowEl = document.getElementById('eyebrowText');
    const headingEl = document.getElementById('headingText');
    eyebrowEl.textContent = state.titles.eyebrow;
    headingEl.textContent = state.titles.heading;
    document.title = state.titles.heading;
  }

  function setupEditableTitle(el, stateKey, fallback){
    let beforeEdit = '';

    el.addEventListener('dblclick', () => {
      beforeEdit = el.textContent;
      el.contentEditable = 'true';
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    function commit(){
      el.contentEditable = 'false';
      const v = el.textContent.trim();
      if(!v){
        el.textContent = beforeEdit || fallback;
        return;
      }
      el.textContent = v;
      if(state.titles[stateKey] !== v){
        state.titles[stateKey] = v;
        document.title = state.titles.heading;
        markUnsaved();
      }
    }

    el.addEventListener('blur', commit);
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        el.blur();
      } else if(e.key === 'Escape'){
        e.preventDefault();
        el.textContent = beforeEdit;
        el.blur();
      }
    });
  }

  setupEditableTitle(document.getElementById('eyebrowText'), 'eyebrow', DEFAULT_TITLES.eyebrow);
  setupEditableTitle(document.getElementById('headingText'), 'heading', DEFAULT_TITLES.heading);

  function renderMonthTabs(){
    const tabs = document.getElementById('monthTabs');
    tabs.innerHTML = '';
    state.order.forEach(key => {
      const b = document.createElement('button');
      b.className = 'month-tab' + (key === state.activeKey ? ' active' : '');
      b.textContent = monthLabel(key);
      b.addEventListener('click', () => {
        state.activeKey = key;
        render();
      });
      tabs.appendChild(b);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'month-tab add-tab';
    addBtn.textContent = '＋ 新增月份';
    addBtn.addEventListener('click', openAddMonth);
    tabs.appendChild(addBtn);
  }

  function renderHeader(){
    const headerRow = document.getElementById('headerRow');
    headerRow.innerHTML = '';

    const numTh = document.createElement('th');
    numTh.className = 'col-num-head';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-row-th-btn';
    addBtn.textContent = '＋';
    addBtn.title = '新增列';
    addBtn.addEventListener('click', () => {
      currentMonth().rows.push(makeRow());
      render();
      markUnsaved();
    });
    numTh.appendChild(addBtn);
    headerRow.appendChild(numTh);

    COLUMNS.forEach((col) => {
      const th = document.createElement('th');
      const label = document.createElement('span');
      label.className = 'th-label';
      label.textContent = col.label;
      th.appendChild(label);
      headerRow.appendChild(th);
    });
  }

  function parseNum(v){
    if(v === '' || v === null || v === undefined) return null;
    const n = parseFloat(String(v).replace(/,/g,''));
    return isNaN(n) ? null : n;
  }

  function renderBody(){
    const month = currentMonth();
    const body = document.getElementById('bodyRows');
    const foot = document.getElementById('footRows');
    body.innerHTML = '';
    foot.innerHTML = '';

    month.rows.forEach((row, rIdx) => {
      ensureRowShape(row);
      const tr = document.createElement('tr');

      const numTd = document.createElement('td');
      numTd.className = 'row-num';
      numTd.textContent = rIdx + 1;
      numTd.addEventListener('dblclick', () => {
        openDeleteRow(rIdx);
      });
      tr.appendChild(numTd);

      COLUMNS.forEach((col) => {
        const td = document.createElement('td');
        if(col.id === 'point' || col.id === 'pnl' || col.id === 'amount' || col.id === 'fee'){
          td.classList.add('align-right');
        }

        if(col.type === 'date'){
          const wrap = document.createElement('div');
          wrap.className = 'date-cell';

          const disp = document.createElement('span');
          disp.className = 'date-display' + (row.cells[col.id] ? '' : ' placeholder');
          disp.textContent = row.cells[col.id] ? formatDateDisplay(row.cells[col.id]) : '選擇日期';

          const input = document.createElement('input');
          input.type = 'date';
          input.className = 'cell-date';
          input.value = row.cells[col.id] || '';
          input.tabIndex = -1;
          input.addEventListener('input', () => {
            row.cells[col.id] = input.value;
            disp.textContent = input.value ? formatDateDisplay(input.value) : '選擇日期';
            disp.classList.toggle('placeholder', !input.value);
            markUnsaved();
          });

          wrap.addEventListener('click', (e) => {
            e.preventDefault();
            if(typeof input.showPicker === 'function'){
              try{ input.showPicker(); return; }catch(err){ /* fall through */ }
            }
            input.focus();
            input.click();
          });

          wrap.appendChild(disp);
          wrap.appendChild(input);
          td.appendChild(wrap);

        } else if(col.type === 'select'){
          const sel = document.createElement('select');
          sel.className = 'cell-select';
          const opts = [{v:'',t:'—'},{v:'買',t:'買'},{v:'賣',t:'賣'}];
          opts.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.v; opt.textContent = o.t;
            sel.appendChild(opt);
          });
          sel.value = row.cells[col.id] || '';
          const applyColor = () => {
            sel.classList.toggle('buy', sel.value === '買');
            sel.classList.toggle('sell', sel.value === '賣');
          };
          applyColor();
          sel.addEventListener('change', () => {
            row.cells[col.id] = sel.value;
            applyColor();
            markUnsaved();
          });
          td.appendChild(sel);

        } else if(col.type === 'number'){
          const div = document.createElement('div');
          div.className = 'cell';
          div.contentEditable = 'true';
          div.dataset.ph = '—';
          div.textContent = row.cells[col.id] || '';
          const applyColor = () => {
            const n = parseNum(row.cells[col.id]);
            div.classList.toggle('num-pos', n !== null && n > 0);
            div.classList.toggle('num-neg', n !== null && n < 0);
          };
          applyColor();
          div.addEventListener('input', () => {
            row.cells[col.id] = div.textContent;
            applyColor();
            updateTotals();
            markUnsaved();
          });
          div.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){ e.preventDefault(); div.blur(); }
          });
          td.appendChild(div);

        } else if(col.type === 'reason'){
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'cell-text-input';
          input.setAttribute('list', 'reasonList');
          input.setAttribute('autocomplete', 'off');
          input.placeholder = '—';
          input.value = row.cells[col.id] || '';
          input.addEventListener('input', () => {
            row.cells[col.id] = input.value;
            markUnsaved();
          });
          input.addEventListener('change', () => {
            updateReasonDatalist();
          });
          input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
          });
          td.appendChild(input);

        } else {
          const div = document.createElement('div');
          div.className = 'cell';
          div.contentEditable = 'true';
          div.dataset.ph = '—';
          div.textContent = row.cells[col.id] || '';
          div.addEventListener('input', () => {
            row.cells[col.id] = div.textContent;
            markUnsaved();
          });
          div.addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){ e.preventDefault(); div.blur(); }
          });
          td.appendChild(div);
        }
        tr.appendChild(td);
      });

      body.appendChild(tr);
    });

    // Totals row in tfoot
    const totalsTr = document.createElement('tr');
    totalsTr.className = 'totals-row';

    const numTd = document.createElement('td');
    numTd.className = 'row-num';
    numTd.textContent = '';
    totalsTr.appendChild(numTd);

    COLUMNS.forEach((col) => {
      const td = document.createElement('td');
      if(col.id === 'point' || col.id === 'pnl' || col.id === 'amount' || col.id === 'fee'){
        td.classList.add('align-right');
      }
      if(col.id === 'point'){
        const span = document.createElement('span');
        span.className = 'totals-label';
        span.textContent = '合計';
        td.appendChild(span);
      } else if(col.id === 'pnl' || col.id === 'amount' || col.id === 'fee'){
        const span = document.createElement('span');
        span.className = 'totals-val';
        span.dataset.totalFor = col.id;
        td.appendChild(span);
      } else {
        const span = document.createElement('span');
        span.className = 'totals-val';
        td.appendChild(span);
      }
      totalsTr.appendChild(td);
    });

    foot.appendChild(totalsTr);
    updateTotals();
  }

  function updateTotals(){
    const month = currentMonth();
    if(!month) return;
    let sumPnl = 0, sumAmount = 0, sumFee = 0;
    month.rows.forEach(row => {
      const p = parseNum(row.cells.pnl);
      const a = parseNum(row.cells.amount);
      const f = parseNum(row.cells.fee);
      if(p !== null) sumPnl += p;
      if(a !== null) sumAmount += a;
      if(f !== null) sumFee += f;
    });
    const pnlEl = document.querySelector('[data-total-for="pnl"]');
    const amtEl = document.querySelector('[data-total-for="amount"]');
    const feeEl = document.querySelector('[data-total-for="fee"]');
    if(pnlEl){
      pnlEl.textContent = formatNum(sumPnl);
      pnlEl.classList.toggle('pos', sumPnl > 0);
      pnlEl.classList.toggle('neg', sumPnl < 0);
    }
    if(amtEl){
      amtEl.textContent = formatNum(sumAmount);
      amtEl.classList.toggle('pos', sumAmount > 0);
      amtEl.classList.toggle('neg', sumAmount < 0);
    }
    if(feeEl){
      feeEl.textContent = formatNum(sumFee);
      feeEl.classList.toggle('pos', sumFee > 0);
      feeEl.classList.toggle('neg', sumFee < 0);
    }
  }

  function formatNum(n){
    const rounded = Math.round(n * 100) / 100;
    return rounded.toLocaleString('zh-TW');
  }

  // ---------- Excel export ----------
  async function exportExcel(){
    if(typeof ExcelJS === 'undefined'){
      alert('Excel 匯出元件載入失敗，請檢查網路連線後再試一次。');
      return;
    }
    const wb = new ExcelJS.Workbook();
    wb.creator = state.titles.heading;
    wb.created = new Date();

    const HEADER_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFBEBEC' } };
    const ROW_WHITE   = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFFFFF' } };
    const ROW_GRAY    = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF6F0F0' } };
    const TOTAL_FILL  = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF3C6CB' } };
    const THIN_BORDER = { style:'thin', color:{ argb:'FFECDFE0' } };
    const BORDERS = { top:THIN_BORDER, bottom:THIN_BORDER, left:THIN_BORDER, right:THIN_BORDER };
    const NUM_FMT = '#,##0.00;[red]-#,##0.00';

    const usedNames = new Set();

    state.order.forEach(key => {
      const month = state.months[key];
      let sheetName = monthLabel(key).replace(/[\\\/*?:\[\]]/g,'');
      if(sheetName.length > 31) sheetName = sheetName.slice(0,31);
      let finalName = sheetName, n = 2;
      while(usedNames.has(finalName)){ finalName = sheetName.slice(0,28) + '_' + n; n++; }
      usedNames.add(finalName);

      const ws = wb.addWorksheet(finalName, { views:[{ state:'frozen', ySplit:1 }] });
      ws.columns = [
        { header:'日期',     key:'date',   width:14 },
        { header:'買賣別',   key:'side',   width:9  },
        { header:'進場點位', key:'point',  width:13 },
        { header:'損益',     key:'pnl',    width:11 },
        { header:'損益金額', key:'amount', width:13 },
        { header:'手續費',   key:'fee',    width:11 },
        { header:'進場原因', key:'reason', width:28 },
      ];

      const headerRow = ws.getRow(1);
      headerRow.eachCell(cell => {
        cell.font = { bold:true, color:{ argb:'FF33302A' } };
        cell.fill = HEADER_FILL;
        cell.alignment = { vertical:'middle', horizontal:'center' };
        cell.border = BORDERS;
      });
      headerRow.height = 20;

      let sumPnl = 0, sumAmount = 0, sumFee = 0;
      month.rows.forEach((r, idx) => {
        const p = parseNum(r.cells.pnl);
        const a = parseNum(r.cells.amount);
        const f = parseNum(r.cells.fee);
        if(p !== null) sumPnl += p;
        if(a !== null) sumAmount += a;
        if(f !== null) sumFee += f;

        const row = ws.addRow({
          date: r.cells.date ? formatDateDisplay(r.cells.date) : '',
          side: r.cells.side || '',
          point: r.cells.point || '',
          pnl: p !== null ? p : '',
          amount: a !== null ? a : '',
          fee: f !== null ? f : '',
          reason: r.cells.reason || ''
        });

        // Force date to plain text so Excel never reinterprets/reformats it
        row.getCell('date').value = r.cells.date ? formatDateDisplay(r.cells.date) : '';
        row.getCell('date').numFmt = '@';

        row.getCell('pnl').numFmt = NUM_FMT;
        row.getCell('amount').numFmt = NUM_FMT;
        row.getCell('fee').numFmt = NUM_FMT;

        const fill = (idx % 2 === 0) ? ROW_WHITE : ROW_GRAY;
        row.eachCell({ includeEmpty:true }, cell => {
          cell.fill = fill;
          cell.border = BORDERS;
          cell.alignment = { vertical:'middle', horizontal: (cell.col === 4 || cell.col === 6) ? 'center' : 'center' };
        });
        row.getCell('point').alignment = { vertical:'middle', horizontal:'right' };
        row.getCell('pnl').alignment = { vertical:'middle', horizontal:'right' };
        row.getCell('amount').alignment = { vertical:'middle', horizontal:'right' };
        row.getCell('fee').alignment = { vertical:'middle', horizontal:'right' };
      });

      const totalRow = ws.addRow({
        date:'', side:'', point:'合計', pnl:sumPnl, amount:sumAmount, fee:sumFee, reason:''
      });
      totalRow.getCell('pnl').numFmt = NUM_FMT;
      totalRow.getCell('amount').numFmt = NUM_FMT;
      totalRow.getCell('fee').numFmt = NUM_FMT;
      totalRow.eachCell({ includeEmpty:true }, cell => {
        cell.fill = TOTAL_FILL;
        cell.font = { bold:true, color:{ argb:'FF33302A' } };
        cell.border = BORDERS;
        cell.alignment = { vertical:'middle', horizontal:'center' };
      });
      totalRow.getCell('point').alignment = { vertical:'middle', horizontal:'right' };
      totalRow.getCell('pnl').alignment = { vertical:'middle', horizontal:'right' };
      totalRow.getCell('amount').alignment = { vertical:'middle', horizontal:'right' };
      totalRow.getCell('fee').alignment = { vertical:'middle', horizontal:'right' };
    });

    const stamp = new Date().toISOString().slice(0,10);
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.titles.heading || '損益紀錄') + '_' + stamp + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---------- Backup / Restore ----------
  function backupData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.titles ? state.titles.heading : '損益紀錄') + '備份_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function restoreFromFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try{
        parsed = JSON.parse(e.target.result);
      }catch(err){
        alert('讀取失敗，請確認是正確的備份檔案（.json）。');
        return;
      }
      if(!parsed || !parsed.months || !parsed.order){
        alert('檔案格式不正確，無法還原。');
        return;
      }
      if(!confirm('確定要用備份檔案覆蓋目前所有資料嗎？此動作無法復原。')) return;
      state = parsed;
      if(!state.activeKey || !state.months[state.activeKey]) state.activeKey = state.order[0];
      state.order.forEach(k => { if(state.months[k]) state.months[k].rows.forEach(ensureRowShape); });
      if(!state.titles || typeof state.titles !== 'object'){
        state.titles = { eyebrow: DEFAULT_TITLES.eyebrow, heading: DEFAULT_TITLES.heading };
      }
      if(!state.titles.eyebrow) state.titles.eyebrow = DEFAULT_TITLES.eyebrow;
      if(!state.titles.heading) state.titles.heading = DEFAULT_TITLES.heading;
      renderTitles();
      render();
      markUnsaved();
    };
    reader.readAsText(file);
  }

  function openBackupRestore(){
    resetModalChrome();
    stepEl.style.display = 'none';
    titleEl.textContent = '備份／恢復';
    msgEl.textContent = '選擇要進行的動作：';
    settingsList.style.display = 'flex';
    modalActions.style.display = 'none';

    const mkBtn = (label, cls, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if(cls) b.className = cls;
      b.addEventListener('click', onClick);
      return b;
    };

    const backupBtn = mkBtn('⬇ 備份（下載 JSON 檔）', '', () => { closeModal(); backupData(); });
    const restoreBtn = mkBtn('⬆ 恢復（從備份檔還原）', '', () => {
      closeModal();
      document.getElementById('restoreFileInput').click();
    });

    settingsList.appendChild(backupBtn);
    settingsList.appendChild(restoreBtn);

    const closeRow = document.createElement('div');
    closeRow.className = 'modal-actions';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '關閉';
    closeBtn.addEventListener('click', closeModal);
    closeRow.appendChild(closeBtn);
    settingsList.appendChild(closeRow);

    openModal();
  }

  document.getElementById('delMonthBtn').addEventListener('click', openDeleteMonth);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
  document.getElementById('backupRestoreBtn').addEventListener('click', openBackupRestore);
  document.getElementById('restoreFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) restoreFromFile(file);
    e.target.value = '';
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(!confirm('確定要清除「' + monthLabel(state.activeKey) + '」所有紀錄嗎？此動作無法復原。')) return;
    state.months[state.activeKey] = makeMonth(state.activeKey);
    render();
    markUnsaved();
  });

  onAuthStateChanged(auth, async user=>{
    if(user){
      currentUid = user.uid;
      const name = user.displayName || user.email.split('@')[0];
      document.getElementById('headerUserName').textContent = name;
      hideLoginScreen();
      await load();
    } else {
      currentUid = null;
      pnlLoadSuccess = false;
      showLoginScreen();
    }
  });
})();
</script>
